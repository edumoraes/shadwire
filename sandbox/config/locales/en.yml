    # Subtitles of the component pages that render through the generic
    # doc_page template. Their titles are component names, which do not
    # translate.
    pages:
      aspect_ratio:
        subtitle: "Keeps content at a fixed ratio using the CSS aspect-ratio property."
      spinner:
        subtitle: "A spinning loading indicator with role=\"status\" and an accessible label."
      kbd:
        subtitle: "Represents keyboard keys. Group several with ui_kbd_group to show a shortcut."
      empty:
        subtitle: "An empty state: media, title, description and actions, centred."
      item:
        subtitle: "A flexible row: media + content (title/description) + actions. Group them with ui_item_group."
      input_group:
        subtitle: "Combines an input or textarea with addons (icons, text, buttons) at either end."
      button_group:
        subtitle: "Visually joins a run of buttons, collapsing the borders and inner corners."
      field:
        subtitle: "Composes a form field's label, control, description and error."
      native_select:
        subtitle: "A native <select>, styled to match the other controls."
      collapsible:
        subtitle: "A section that expands and collapses, driven by the ui-collapsible controller."
      toggle:
        subtitle: "A two-state button with aria-pressed and data-state (on/off)."
      toggle_group:
        subtitle: "A group of toggles with single or multiple selection and arrow-key navigation."
      slider:
        subtitle: "A single-thumb slider (the WAI-ARIA pattern) with its value mirrored into a hidden input."
      hover_card:
        subtitle: "Rich content that opens on hovering or focusing the trigger, with configurable delays."
      input_otp:
        subtitle: "A one-time code field: single-character slots with advance, backspace and paste."
      drawer:
        subtitle: "A panel sliding in from an edge, built on the native <dialog>, with drag-to-close."
      context_menu:
        subtitle: "A menu opened with the right mouse button, positioned at the pointer, with keyboard navigation."
      menubar:
        subtitle: "A horizontal menu bar (the WAI-ARIA menubar pattern) coordinated by a controller."
      navigation_menu:
        subtitle: "Navigation whose triggers reveal content panels, one at a time."
      command:
        subtitle: "A filterable command palette, with arrow-key navigation and Enter."
      combobox:
        subtitle: "A Popover with a Command inside. It is not a separate component: installing it installs popover and command."
      resizable:
        subtitle: "Resizable panels with draggable handles and keyboard adjustment."
      carousel:
        subtitle: "A slide carousel with previous/next controls and arrow-key navigation."
      sonner:
        subtitle: "Temporary notifications stacked in a polite live region. Fire them with window.toast or through Stimulus."
      chart:
        subtitle: "Charts drawn with D3 and built from parts: a grid, axes, series, a tooltip and a legend, or a layer you draw yourself."
      data_table:
        subtitle: "A table with filtering, sorting, pagination, row selection and column visibility, all in the browser."

