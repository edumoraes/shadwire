# Page prose does NOT live here. A guide or component page keeps its text inline
# in a locale-suffixed template (installation.en.html.erb / installation.pt.html.erb),
# because that prose is threaded through markup and inline <code> and reads far
# better as one continuous document than as a hundred numbered keys.
#
# English is the default locale and this file is the reference: pt.yml mirrors
# its shape. A key missing from pt.yml falls back here rather than rendering a
# translation-missing span.
