      files_html: "O item %{name} do registry instala estes arquivos:"
      stimulus_html: "Este componente usa Stimulus, então a aplicação precisa de %{importmap} e %{stimulus} com carregamento automático de controllers."
      cli_html: "Ainda não instalou a CLI? %{install} e depois %{init}."
