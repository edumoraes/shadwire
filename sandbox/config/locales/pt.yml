    # Subtitles of the component pages that render through the generic
    # doc_page template. Their titles are component names, which do not
    # translate.
    pages:
      aspect_ratio:
        subtitle: "Mantém o conteúdo em uma proporção fixa usando a propriedade CSS aspect-ratio."
      spinner:
        subtitle: "Um indicador de carregamento giratório com role=\"status\" e rótulo acessível."
      kbd:
        subtitle: "Representa teclas do teclado. Agrupe várias com ui_kbd_group para exibir um atalho."
      empty:
        subtitle: "Um estado vazio: mídia, título, descrição e ações centralizados."
      item:
        subtitle: "Uma linha flexível: mídia + conteúdo (título/descrição) + ações. Agrupe com ui_item_group."
      input_group:
        subtitle: "Combina um input/textarea com addons (ícones, texto, botões) no início ou fim."
      button_group:
        subtitle: "Junta visualmente uma sequência de botões, colapsando bordas e cantos internos."
      field:
        subtitle: "Compõe label, controle, descrição e erro de um campo de formulário."
      native_select:
        subtitle: "Um <select> nativo estilizado para combinar com os demais controles."
      collapsible:
        subtitle: "Uma seção que expande e recolhe, controlada pelo controller ui-collapsible."
      toggle:
        subtitle: "Um botão de dois estados com aria-pressed e data-state (on/off)."
      toggle_group:
        subtitle: "Um grupo de toggles com seleção única ou múltipla e navegação por setas."
      slider:
        subtitle: "Um slider de um thumb (padrão WAI-ARIA) com valor espelhado em um input hidden."
      hover_card:
        subtitle: "Conteúdo rico que abre ao passar o mouse ou focar o gatilho, com atrasos configuráveis."
      input_otp:
        subtitle: "Campo de código de uso único: slots de um caractere com avanço, backspace e colagem."
      drawer:
        subtitle: "Um painel que desliza de uma borda, sobre um <dialog> nativo, com arrastar para fechar."
      context_menu:
        subtitle: "Um menu aberto com o botão direito, posicionado no ponteiro, com navegação por teclado."
      menubar:
        subtitle: "Uma barra de menus horizontal (padrão WAI-ARIA menubar) coordenada por um controller."
      navigation_menu:
        subtitle: "Uma navegação com gatilhos que revelam painéis de conteúdo, um de cada vez."
      command:
        subtitle: "Uma paleta de comandos filtrável, com navegação por setas e Enter."
      combobox:
        subtitle: "Uma receita: Popover + Command. Não é um componente novo — instala popover e command."
      resizable:
        subtitle: "Painéis redimensionáveis com alças arrastáveis e ajuste por teclado."
      carousel:
        subtitle: "Um carrossel de slides com controles anterior/próximo e navegação por setas."
      sonner:
        subtitle: "Notificações temporárias empilhadas numa região live polida. Dispare com window.toast ou via Stimulus."
      chart:
        subtitle: "Gráficos com Chart.js. A paleta usa os tokens --chart-1..5 do tema. É a única dependência JS de terceiros."
      data_table:
        subtitle: "Tabela com filtro, ordenação, paginação, seleção de linhas e visibilidade de colunas — tudo no cliente."

