name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on feature branches, but never cancel a run on `main`
# (it may be mid-deploy to GitHub Pages).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: sandbox
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Rubocop (rails-omakase)
        working-directory: sandbox
        run: bin/rubocop -f github
      - name: Theme lint
        run: ruby test/theme_lint_test.rb

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: sandbox
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Gem audit (bundler-audit)
        working-directory: sandbox
        run: bin/bundler-audit
      - name: Importmap vulnerability audit
        working-directory: sandbox
        run: bin/importmap audit
      - name: Brakeman static analysis
        working-directory: sandbox
        # Call brakeman directly to skip bin/brakeman's --ensure-latest, which
        # fails CI whenever a newer Brakeman ships before Dependabot bumps it.
        run: bundle exec brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      # The sandbox's parallel test runner can deadlock with zombie workers, so
      # run serially (matches the known-good local invocation).
      PARALLEL_WORKERS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: sandbox
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Prepare test database
        working-directory: sandbox
        run: bin/rails db:prepare
      - name: Component + accessibility tests
        working-directory: sandbox
        run: bin/rails test test/components test/integration
      - name: Docs page tests
        working-directory: sandbox
        run: bin/rails test test/controllers test/helpers
      # Runs headless Chrome, which ubuntu-latest ships; selenium-webdriver
      # fetches its own driver. Adds roughly 90s to this job — worth it, since
      # the controllers that make the components work are only exercised here.
      - name: System tests
        working-directory: sandbox
        run: bin/rails test:system
      - name: Capybara failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capybara-screenshots
          path: sandbox/tmp/screenshots
          if-no-files-found: ignore
      - name: Seeds replant
        working-directory: sandbox
        run: bin/rails db:seed:replant
      - name: Registry manifest test
        run: ruby test/registry_manifest_test.rb
      - name: Registry schema test
        run: ruby test/registry_schema_test.rb
      - name: Registry build test
        run: ruby test/registry_build_test.rb

  registry_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: sandbox
          ruby-version: .ruby-version
      - name: Sync registry into the sandbox
        run: bin/sync_registry
      - name: Fail on drift between registry and sandbox
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The sandbox is out of sync with registry/. Edit sources in registry/, run bin/sync_registry, and commit the result."
            git --no-pager diff
            git status --porcelain
            exit 1
          fi
          echo "registry/ and sandbox/ are in sync."

  docs_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - name: Link check (lenient)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --cache --max-cache-age 1d './**/*.md'"
          fail: false

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: packages/cli
          ruby-version: .ruby-version
          bundler-cache: true
      - name: CLI tests
        working-directory: packages/cli
        run: bundle exec rake test

  skill_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: packages/cli
          bundler-cache: true
      - name: Component API extractor
        run: ruby test/api_extractor_test.rb
      - name: llms.txt writer
        run: ruby test/llms_writer_test.rb
      # Asserts the agent skill still matches the registry and CLI it documents,
      # and runs the workflow it teaches end to end.
      - name: Skill accuracy + workflow smoke test
        run: ruby test/skill_check_test.rb

  deploy_pages:
    needs: [lint, security, test, registry_sync, docs_lint, cli, skill_check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    # Serialize Pages deploys; never cancel one in flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RAILS_ENV: production
      # The site is served from the custom domain (shadwire.edumoraes.dev.br) at
      # the domain root, not under /<repo>/, so generated links and asset paths
      # must carry no sub-URI prefix. Leaving PAGES_BASE_PATH unset keeps the
      # `map` in config.ru and relative_url_root in production.rb inert.
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: sandbox
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/configure-pages@v6
      - name: Generate a build secret
        working-directory: sandbox
        run: echo "SECRET_KEY_BASE=$(bin/rails secret)" >> "$GITHUB_ENV"
      - name: Precompile assets and prepare database
        working-directory: sandbox
        run: |
          bin/rails assets:precompile
          bin/rails db:prepare
      - name: Build the published registry
        run: bin/build_registry
      # The corpus the ⌘K palette searches. Built by rendering every page the
      # palette offers, so it does not depend on the crawl below having run or
      # on how wget named its files. Must come before the freeze: the server
      # started there serves it out of public/.
      - name: Build the documentation search index
        working-directory: sandbox
        run: bin/rails docs:search_index
      - name: Freeze the docs site to static HTML
        working-directory: sandbox
        run: |
          bin/rails server -e production -b 127.0.0.1 -p 3000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/up >/dev/null && break
            sleep 1
          done
          rm -rf ../_site && mkdir -p ../_site
          # Mirror every page reachable from the home page. Links/asset/importmap
          # paths are absolute from the site root, so the artifact root maps
          # straight onto the domain root. Skip /assets: the precompiled assets
          # are copied wholesale below, and crawling them would also choke on any
          # broken asset reference in the docs.
          wget --mirror --no-verbose -e robots=off \
               --no-host-directories --exclude-directories=/assets \
               --adjust-extension --directory-prefix=../_site \
               http://127.0.0.1:3000/ || wget_ec=$?
          # Exit 8 = a referenced resource returned 4xx (e.g. a broken image in a
          # doc example). Tolerate it for a static snapshot, but fail on real errors.
          if [ "${wget_ec:-0}" -ne 0 ] && [ "${wget_ec:-0}" -ne 8 ]; then
            echo "::error::wget crawl failed (exit ${wget_ec})"; cat /tmp/server.log; exit "${wget_ec}"
          fi
          # wget does not follow ES module / importmap references, so copy the
          # precompiled assets wholesale to guarantee every JS/CSS/font is present.
          cp -r public/assets ../_site/assets
          # Nothing links to the search index either — the palette fetches it on
          # the first keystroke — so the crawl never sees it.
          cp public/search-index.*.json ../_site/
          touch ../_site/.nojekyll
          test -f ../_site/index.html || { echo "::error::no index.html produced"; cat /tmp/server.log; exit 1; }
          # The site ships in two languages, and the Portuguese tree exists in
          # this artifact only because every English page links at its
          # counterpart. Losing the switcher would not fail anything above — it
          # would quietly publish a monolingual site — so compare the two trees.
          en=$(find ../_site -name '*.html' -not -path '../_site/pt/*' -not -name 'pt.html' | wc -l)
          # --adjust-extension freezes the Portuguese home as pt.html, beside the
          # pt/ directory rather than inside it, so count it on its own or the
          # tally reads one short and the two trees never appear to match.
          pt=$(( $(find ../_site/pt -name '*.html' 2>/dev/null | wc -l) + $(test -f ../_site/pt.html && echo 1 || echo 0) ))
          echo "frozen pages: ${en} en / ${pt} pt"
          if [ "$pt" -lt "$en" ]; then
            echo "::error::the Portuguese tree is short (${pt} pages against ${en} English) — the crawl did not reach it"
            exit 1
          fi
      - name: Publish the registry into the Pages artifact
        # Serve the built registry at /shadwire/r/... alongside the docs site.
        run: cp -r build/r _site/r
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
